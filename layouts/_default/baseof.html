<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="alternate" type="application/rss+xml" href="{{ "/index.xml" | relURL }}" title="{{ .Site.Title }}">
  <link rel="alternate" type="text/plain" href="{{ "/llms.txt" | relURL }}" title="LLM-readable overview">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --line: #111111;
      --soft: #f5f5f5;
      --code-bg: #f4f4f4;
      --code-fg: #1f1f1f;
      --code-line: #c9c9c9;
      --link: #0645ad;
      --visited: #5a2ca0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181818;
        --fg: #e5e5e5;
        --muted: #a0a0a0;
        --line: #4a4a4a;
        --soft: #242424;
        --code-bg: #101010;
        --code-fg: #f0f0f0;
        --code-line: #3a3a3a;
        --link: #8ab4ff;
        --visited: #c9a7ff;
      }
    }

    body {
      margin: 0 auto;
      max-width: 720px;
      padding: 24px 18px 56px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    header.site {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: baseline;
      padding-bottom: 18px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    nav a { margin-left: 10px; }
    a { color: var(--link); text-decoration: underline; }
    a:visited { color: var(--visited); }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    h2 { font-size: 20px; margin-top: 34px; }
    h3 { font-size: 17px; margin-top: 26px; }
    p { margin: 0 0 16px; }
    ul, ol { padding-left: 1.4em; }
    li { margin: 0 0 6px; }
    code {
      background: var(--soft);
      padding: 1px 4px;
      border-radius: 3px;
    }
    pre {
      overflow-x: auto;
      margin: 22px 0;
      padding: 16px 18px;
      border: 1px solid var(--code-line);
      background: var(--code-bg);
      color: var(--code-fg);
      line-height: 1.55;
    }
    pre code {
      padding: 0;
      background: transparent;
      color: inherit;
      border-radius: 0;
    }
    .highlight {
      margin: 22px 0;
      border: 1px solid var(--code-line);
      background: var(--code-bg);
    }
    .highlight pre {
      margin: 0;
      border: 0;
      background: transparent !important;
    }
    .highlight code,
    .highlight .chroma {
      background: transparent !important;
      color: var(--code-fg) !important;
    }
    table { width: 100%; border-collapse: collapse; margin: 18px 0; }
    th, td { border: 1px solid var(--line); padding: 8px; vertical-align: top; }
    th { background: var(--soft); }
    blockquote {
      margin: 20px 0;
      padding: 10px 16px;
      border-left: 3px solid var(--line);
      background: var(--soft);
    }
    .muted, .meta { color: var(--muted); font-size: 13px; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { margin-bottom: 12px; }
    .tag {
      display: inline-block;
      margin: 0 6px 6px 0;
      padding: 1px 7px;
      border: 1px solid var(--line);
      color: var(--fg);
      text-decoration: none;
      font-size: 12px;
    }
    .callout {
      border: 1px solid var(--line);
      background: var(--soft);
      padding: 14px;
      margin: 22px 0;
    }
    footer.site {
      margin-top: 42px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="site">
    <a href="{{ "/" | relURL }}"><strong>Source of Truth</strong></a>
    <nav>
      <a href="{{ "/blog/" | relURL }}">blog</a>
      <a href="{{ "/playbook/" | relURL }}">playbook</a>
      <a href="{{ "/research/" | relURL }}">research</a>
      <a href="{{ "/prompts/" | relURL }}">prompts</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site">
    Живой канон. Новая ссылка превращается в note, pattern, playbook update или статью.
  </footer>
</body>
</html>
